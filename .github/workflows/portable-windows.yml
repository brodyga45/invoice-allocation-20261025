name: Windows portable candidate
on:
  push:
    branches: [main, codex/invoice-allocation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and build tool
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Core and local HTTP checks on Windows
        run: python -m unittest discover -s tests -v
      - name: Bundle unchanged application
        run: python tools/build_portable.py
      - name: Test the actual frozen executable
        run: python tools/check_portable.py dist/InvoiceAllocation/InvoiceAllocation.exe
      - name: Package portable folder
        run: |
          python -c "import shutil; shutil.make_archive('InvoiceAllocation-0.1.0-Windows-x64', 'zip', 'dist', 'InvoiceAllocation')"
          python -c "import hashlib,pathlib; p=pathlib.Path('InvoiceAllocation-0.1.0-Windows-x64.zip'); pathlib.Path('SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceAllocation-0.1.0-Windows-x64
          path: |
            InvoiceAllocation-0.1.0-Windows-x64.zip
            SHA256SUMS.txt
            portable-check.json
          retention-days: 30
